<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Admin | CodeKids</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <div class="container nav">
        <a href="index.html" class="brand"><span class="brand-mark">CK</span><strong>Ir para o Site</strong></a>
        <button id="theme-toggle" class="theme-toggle-btn">🌙</button>
      </div>
    </header>

    <main class="container admin-main">
      <!-- SESSÃO DE LOGIN -->
      <div id="login-section" class="auth-card fade-up visible">
        <span class="eyebrow">Equipe Pedagógica</span>
        <h2 style="margin-top:12px; color:var(--primary);">Login CMS CodeKids</h2>
        <form id="login-form" class="auth-form">
          <label>Senha de acesso <input type="password" id="admin-password" placeholder="Digite: admin123" required /></label>
          <div class="form-actions">
            <button type="submit" class="button button-primary full">Entrar no painel</button>
          </div>
        </form>
      </div>

      <!-- SESSÃO DO PAINEL (Oculta por padrão) -->
      <div id="dashboard-section" class="hidden fade-up">
        <div class="admin-header">
          <h1>Gerenciador de Postagens</h1>
          <button id="logout-btn" class="button button-secondary">Sair do Painel</button>
        </div>
        
        <div class="admin-grid">
          <aside class="admin-sidebar">
            <p style="color:var(--muted); font-size:14px; margin:0;">As postagens publicadas aqui aparecerão automaticamente na página inicial do site.</p>
          </aside>
          
          <section class="admin-content">
            <!-- Formulário CRUD -->
            <div class="cms-form">
              <h3 id="form-cms-title" style="margin-top:0; color:var(--primary);">Adicionar Nova Notícia</h3>
              <form id="post-form" class="auth-form">
                <input type="hidden" id="edit-id" value="">
                
                <label>Título da Notícia <input type="text" id="post-title" placeholder="Ex: Formatura Turma de Python" required /></label>
                <label>Resumo / Texto <textarea id="post-excerpt" rows="3" required></textarea></label>
                
                <label>Imagem (Upload) 
                  <input type="file" id="post-image-file" accept="image/png, image/jpeg" style="background:var(--card)" />
                  <small style="color:var(--muted);">Ou deixe vazio para manter a imagem atual se estiver editando.</small>
                </label>
                
                <div class="form-actions" style="margin-top:16px;">
                  <button type="submit" id="btn-save" class="button button-primary">Publicar Notícia</button>
                  <button type="button" id="btn-cancel" class="button button-secondary hidden">Cancelar Edição</button>
                </div>
              </form>
            </div>

            <!-- Lista de Postagens -->
            <h3 style="color:var(--primary);">Notícias Publicadas</h3>
            <div id="admin-posts-list"></div>
          </section>
        </div>
      </div>
    </main>
    <script src="js/admin.js"></script>
  </body>
</html>
